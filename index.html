<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coğrafya Oyunu - Giriş</title>

    <style>
        /* Genel Sayfa Ayarları */
        body {
            background: #222;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Mobilde adres çubuğu sorununu önler */
            margin: 0;
            padding: 20px;
            /* Ekranın dibine girmesin diye pay bıraktık */
            box-sizing: border-box;
            font-family: sans-serif;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            color: #ffd700;
            /* Başlığa altın sarısı bir hava katalım */
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        h3 {
            margin-bottom: 40px;
            font-weight: normal;
            opacity: 0.8;
        }

        /* Responsive Buton Tasarımı */
        button {
            width: 100%;
            /* Mobilde ekranı tam kaplasın */
            max-width: 350px;
            /* Ama PC'de 350px'den büyük olmasın */
            padding: 18px 20px;
            margin: 10px 0;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid #555;
            border-radius: 12px;
            /* Köşeleri yuvarlat */
            background: #333;
            color: white;
            transition: all 0.3s ease;
            /* Hover efekti için yumuşak geçiş */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Butonun üzerine gelince veya dokununca olacaklar */
        button:hover,
        button:active {
            background: #444;
            border-color: #ffd700;
            transform: translateY(-3px);
            /* Hafifçe yukarı kalksın */
            box-shadow: 0 6px 12px rgba(255, 215, 0, 0.2);
        }

        /* KÜÇÜK EKRANLAR İÇİN (Telefonlar) İNCE AYAR */
        @media (max-width: 480px) {
            h1 {
                font-size: 2em;
                /* Başlığı telefona sığdır */
            }

            button {
                font-size: 1.1em;
                /* Buton yazısını dengeli hale getir */
                padding: 15px;
            }
        }

        .oyun-logo {
            /* MOBİL ÖNCELİKLİ GENİŞLİK (Yüzdesel) */
            width: 70%;

            /*  MASAÜSTÜ SINIRI*/
            max-width: 350px;

            /*  ORAN KORUMA (EN KRİTİK KISIM) */
            height: auto;

            margin-bottom: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <img class="oyun-logo" src="kapak.jpeg">
    <h3>Lütfen Bir Seviye Seçin:</h3>

    <button onclick="oyunaGec('kolay')">🟢 İl Tahmin</button>
    <button onclick="oyunaGec('zor')">🔴 Türkiye'nin Enleri</button>

    <script>
        function oyunaGec(asama) {
            // Seçimi hafızaya kaydet
            localStorage.setItem('asama', asama);

            // Oyun sayfasına yönlendir
            window.location.href = 'InGame.html';
        }
    </script>

</body>

</html>
